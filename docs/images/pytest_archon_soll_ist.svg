<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" />
    </filter>
    
    <!-- Markers -->
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; }
    .pkg-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
    .pkg-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 500; }
    .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
  </style>

  <!-- ============================================================== -->
  <!-- LEFT PANEL: SOLL-ARCHITEKTUR (Target Architecture)            -->
  <!-- ============================================================== -->
  <g transform="translate(15, 10)">
    <!-- Container Card -->
    <rect x="0" y="0" width="435" height="360" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)" />
    
    <!-- Header Banner -->
    <path d="M 0 12 Q 0 0 12 0 L 423 0 Q 435 0 435 12 L 435 44 L 0 44 Z" fill="#ecfdf5" />
    <text x="18" y="28" class="title" fill="#065f46">🎯 SOLL-Architektur</text>
    <rect x="330" y="14" width="90" height="20" rx="10" fill="#10b981" />
    <text x="375" y="28" class="badge" fill="#ffffff" text-anchor="middle">TEST: GREEN</text>
    <line x1="0" y1="44" x2="435" y2="44" stroke="#a7f3d0" stroke-width="1" />

    <!-- 1. UI Package -->
    <g transform="translate(125, 60)">
      <rect x="0" y="0" width="185" height="42" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
      <text x="92" y="20" class="pkg-title" fill="#1e293b" text-anchor="middle">shop.ui</text>
      <text x="92" y="34" class="pkg-sub" fill="#64748b" text-anchor="middle">CLI / Web Controllers</text>
    </g>

    <!-- Arrow UI -> Services -->
    <path d="M 217 102 L 217 132" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-gray)" />

    <!-- 2. Services Package -->
    <g transform="translate(125, 134)">
      <rect x="0" y="0" width="185" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
      <text x="92" y="20" class="pkg-title" fill="#1e40af" text-anchor="middle">shop.services</text>
      <text x="92" y="34" class="pkg-sub" fill="#3b82f6" text-anchor="middle">OrderService, PaymentService</text>
    </g>

    <!-- Arrow Services -> Model (Down Left) -->
    <path d="M 180 176 L 125 218" fill="none" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-green)" />
    <!-- Arrow Services -> Adapters (Down Right) -->
    <path d="M 255 176 L 310 218" fill="none" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-green)" />

    <!-- 3. Model Package (PURE DOMAIN) -->
    <g transform="translate(25, 220)">
      <rect x="0" y="0" width="175" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
      <text x="87" y="22" class="pkg-title" fill="#065f46" text-anchor="middle">shop.model (Core)</text>
      <text x="87" y="38" class="pkg-sub" fill="#047857" text-anchor="middle">Pure POPOs (Order, Item)</text>
    </g>

    <!-- 4. Adapters Package -->
    <g transform="translate(235, 220)">
      <rect x="0" y="0" width="175" height="50" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5" />
      <text x="87" y="22" class="pkg-title" fill="#6b21a8" text-anchor="middle">shop.adapters</text>
      <text x="87" y="38" class="pkg-sub" fill="#7e22ce" text-anchor="middle">InMemoryOrderRepository</text>
    </g>

    <!-- Arrow Adapters -> Model (Allowed) -->
    <path d="M 235 245 L 208 245" fill="none" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-green)" />

    <!-- Summary Box -->
    <g transform="translate(18, 290)">
      <rect x="0" y="0" width="399" height="55" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
      <text x="12" y="20" class="edge-label" fill="#15803d">✅ Erlaubter gerichteter Abhängigkeitsfluss:</text>
      <text x="12" y="35" class="pkg-sub" fill="#166534">• Services orchestrieren Model &amp; Adapters</text>
      <text x="12" y="47" class="pkg-sub" fill="#166534">• Model ist vollkommen autark (keine ausgehenden Abhängigkeiten)</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- RIGHT PANEL: IST-ARCHITEKTUR (Actual with Architecture Bug)   -->
  <!-- ============================================================== -->
  <g transform="translate(470, 10)">
    <!-- Container Card -->
    <rect x="0" y="0" width="435" height="360" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)" />
    
    <!-- Header Banner -->
    <path d="M 0 12 Q 0 0 12 0 L 423 0 Q 435 0 435 12 L 435 44 L 0 44 Z" fill="#fef2f2" />
    <text x="18" y="28" class="title" fill="#991b1b">⚠️ IST-Architektur (Architekturverletzung)</text>
    <rect x="340" y="14" width="80" height="20" rx="10" fill="#ef4444" />
    <text x="380" y="28" class="badge" fill="#ffffff" text-anchor="middle">TEST: RED</text>
    <line x1="0" y1="44" x2="435" y2="44" stroke="#fecaca" stroke-width="1" />

    <!-- 1. UI Package -->
    <g transform="translate(125, 60)">
      <rect x="0" y="0" width="185" height="42" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
      <text x="92" y="20" class="pkg-title" fill="#1e293b" text-anchor="middle">shop.ui</text>
      <text x="92" y="34" class="pkg-sub" fill="#64748b" text-anchor="middle">CLI / Web Controllers</text>
    </g>

    <!-- Arrow UI -> Services -->
    <path d="M 217 102 L 217 132" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-gray)" />

    <!-- 2. Services Package -->
    <g transform="translate(125, 134)">
      <rect x="0" y="0" width="185" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
      <text x="92" y="20" class="pkg-title" fill="#1e40af" text-anchor="middle">shop.services</text>
      <text x="92" y="34" class="pkg-sub" fill="#3b82f6" text-anchor="middle">OrderService, PaymentService</text>
    </g>

    <!-- Arrow Services -> Model (Down Left) -->
    <path d="M 195 176 L 145 218" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)" />
    <!-- Arrow Services -> Adapters (Down Right) -->
    <path d="M 255 176 L 310 218" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)" />

    <!-- 3. Model Package -->
    <g transform="translate(25, 220)">
      <rect x="0" y="0" width="175" height="50" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="2" />
      <text x="87" y="22" class="pkg-title" fill="#9f1239" text-anchor="middle">shop.model (Corrupted)</text>
      <text x="87" y="38" class="pkg-sub" fill="#be123c" text-anchor="middle">Order imports PaymentService</text>
    </g>

    <!-- 4. Adapters Package -->
    <g transform="translate(235, 220)">
      <rect x="0" y="0" width="175" height="50" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5" />
      <text x="87" y="22" class="pkg-title" fill="#6b21a8" text-anchor="middle">shop.adapters</text>
      <text x="87" y="38" class="pkg-sub" fill="#7e22ce" text-anchor="middle">InMemoryOrderRepository</text>
    </g>

    <!-- Arrow Adapters -> Model -->
    <path d="M 235 245 L 208 245" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)" />

    <!-- ❌ FORBIDDEN DEPENDENCY ARROW (Model -> Services) WITH CYCLE! -->
    <path d="M 65 218 C 50 160, 95 145, 118 145" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arrow-red)" />
    
    <!-- Violation Label Box -->
    <g transform="translate(40, 150)">
      <rect x="-35" y="-12" width="115" height="24" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1" />
      <text x="22" y="3" class="edge-label" fill="#b91c1c" text-anchor="middle">❌ Verbotener Import!</text>
    </g>

    <!-- Summary Box -->
    <g transform="translate(18, 290)">
      <rect x="0" y="0" width="399" height="55" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
      <text x="12" y="20" class="edge-label" fill="#b91c1c">❌ Zyklische &amp; verbotene Abhängigkeit:</text>
      <text x="12" y="35" class="pkg-sub" fill="#991b1b">• order.py importiert PaymentService ➔ Zyklus Services ⇄ Model</text>
      <text x="12" y="47" class="pkg-sub" fill="#991b1b">• Domäne verliert Unabhängigkeit; pytest-archon schlägt sofort fehl</text>
    </g>
  </g>
</svg>
